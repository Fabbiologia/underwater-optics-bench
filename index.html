<style>
  /* Single committed dark look: an optical bench in a darkened lab, built to read on a projector. */
  :root {
    color-scheme: dark;
    --ink: #0A1215;
    --panel: #0F1A1E;
    --panel-2: #14242A;
    --line: #22373E;
    --text: #E3ECEA;
    --muted: #8BA2A6;
    --amber: #F2B64E;
    --sea: #43A9C6;
    --good: #6BCB8B;
    --warn: #F2B64E;

  html, body { height: 100%; }

  #app { height: 100%; display: grid; grid-template-rows: auto 1fr; }

  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 28px;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--ink);
  }
  .brand { font: 700 21px/1 var(--display); letter-spacing: .05em; text-transform: uppercase; }
  .brand small { display: block; margin-top: 4px; font: 500 12px/1 var(--display); letter-spacing: .14em; color: var(--muted); }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .tab {
    font: 600 15px/1 var(--display); letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); background: none; border: 0; padding: 9px 14px; border-radius: 7px; cursor: pointer;
  }
  .tab .n { opacity: .55; margin-right: 6px; font-family: var(--mono); font-size: 12px; }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { background: var(--text); color: var(--ink); }
  .tab[aria-selected="true"] .n { opacity: .7; }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 390px; min-height: 0; }
  #stage { position: relative; min-height: 0; overflow: hidden; }
  #gl { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #gl:active { cursor: grabbing; }
  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .lbl {
    position: absolute; left: 0; top: 0; white-space: nowrap;
    font: 600 12.5px/1.2 var(--display); letter-spacing: .07em; text-transform: uppercase;
    padding: 3px 7px; border-radius: 4px; color: var(--text);
    background: rgba(10, 18, 21, .78); border: 1px solid rgba(227, 236, 234, .16);
  }
  .viewbar { position: absolute; left: 16px; bottom: 16px; display: flex; gap: 6px; flex-wrap: wrap; }
  .vbtn {
    font: 600 13px/1 var(--display); letter-spacing: .08em; text-transform: uppercase;
    color: var(--text); background: rgba(15, 26, 30, .85); border: 1px solid var(--line);
    padding: 8px 12px; border-radius: 6px; cursor: pointer;
  }
  .vbtn:hover { border-color: var(--muted); }
  .hint { position: absolute; right: 16px; bottom: 20px; color: var(--muted); font-size: 12.5px; text-align: right; }
  .scalenote { position: absolute; left: 16px; top: 14px; color: var(--muted); font: 500 12.5px/1.3 var(--display); letter-spacing: .08em; text-transform: uppercase; max-width: 60%; }

  aside { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 18px 18px 32px; }

  .pill.good { background: rgba(107, 203, 139, .16); color: var(--good); }
  .pill.warn { background: rgba(242, 182, 78, .16); color: var(--warn); }
  .pill.bad { background: rgba(240, 115, 90, .16); color: var(--bad); }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 7px; vertical-align: 0; }


  .jump {
    margin-top: 10px; font: 600 13px/1 var(--display); letter-spacing: .08em; text-transform: uppercase;
    color: var(--sea); background: none; border: 1px solid rgba(67, 169, 198, .45); border-radius: 6px; padding: 7px 10px; cursor: pointer;
  }
  .jump:hover { background: rgba(67, 169, 198, .12); }
  .ws { border-top: 1px solid var(--line); padding-top: 18px; display: flex; flex-direction: column; gap: 12px; scroll-margin-top: 12px; }
  .ws-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }

  .ws-actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .ws-note { margin: 0; color: var(--muted); font-size: 14px; }
  .ws-list { margin: 0; padding-left: 1.6em; display: flex; flex-direction: column; gap: 16px; }

  .ws-list .set {

    background: rgba(67, 169, 198, .1); border: 1px solid rgba(67, 169, 198, .28); border-radius: 4px; padding: 2px 6px;
  }
  .ws-list .q { margin: 0; max-width: 62ch; }
  .ws-copy { width: 100%; min-height: 160px; font: 13px/1.45 var(--mono); color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
  .ticks { grid-column: 1 / -1; display: flex; justify-content: space-between; margin-top: 1px; font: 500 11.5px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .credit { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
  .credit a { color: var(--muted); }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  @media (max-width: 900px) {
    #app { height: auto; }
    main { grid-template-columns: 1fr; grid-template-rows: 60vh auto; }

    .hint { display: none; }
    .scalenote { max-width: 90%; }
  }

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const YAXIS = V(0, 1, 0);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const deg = r => r * 180 / Math.PI, rad = d => d * Math.PI / 180;
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- renderer, scene, camera ---------- */
const canvas = document.getElementById('gl');
const stage = document.getElementById('stage');
const labelsEl = document.getElementById('labels');
/* Three layers per frame:
   1. world   – physically lit scenery, rendered to an HDR target that keeps its depth
   2. water   – a full-screen pass that ray-marches the water volume against that depth
                (per-wavelength absorption, scattering, sun shafts), then tone-maps
   3. overlay – the teaching diagram (rays, cones, markers), drawn crisp on top */
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
const PR = Math.min(window.devicePixelRatio || 1, 1.5);
renderer.setPixelRatio(PR);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const HDR = renderer.capabilities.isWebGL2 && !!renderer.extensions.get('EXT_color_buffer_float');
const world = new THREE.Scene();
const overlay = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(38, 1, 0.05, 900);
const lin = c => new THREE.Color(c).convertSRGBToLinear();

const hemi = new THREE.HemisphereLight(0xffffff, 0x202020, 0.6);
world.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
world.add(sun, sun.target);
function setLights(o) {
  hemi.color.copy(lin(o.sky)); hemi.groundColor.copy(lin(o.ground)); hemi.intensity = o.hemi;
  sun.color.copy(lin(o.sunCol)); sun.intensity = o.sun;
  sun.position.copy(o.pos); sun.target.position.copy(o.target);
  const c = sun.shadow.camera;
  c.left = c.bottom = -o.ext; c.right = c.top = o.ext; c.near = 0.5; c.far = o.far || 140;
  c.updateProjectionMatrix();
}
overlay.add(new THREE.HemisphereLight(0xdfefff, 0x0a1a20, 0.9));
const ovSun = new THREE.DirectionalLight(0xffffff, 0.9);
ovSun.position.set(5, 12, 6);
overlay.add(ovSun);

/* ---------- spectral model shared by the shaders and the insets ---------- */
const WL = [400, 450, 500, 550, 600, 650, 700];
const BINW = [[0.15, 0, 0.5], [0.05, 0.1, 1.0], [0, 0.6, 0.5], [0.35, 1.0, 0.05], [1.0, 0.55, 0], [1.0, 0.1, 0], [0.35, 0, 0]];
const BINN = [2.9, 2.35, 2.05];
const wrow = c => BINW.map(w => (w[c] / BINN[c]).toFixed(5));
const glDot = c => { const r = wrow(c); return `dot(a, vec4(${r.slice(0, 4)})) + dot(b, vec3(${r.slice(4)}))`; };

/* uniforms shared by the water pass and every underwater material */
const UW = {
  uOn: { value: 0 }, uBoxMin: { value: V(0, 0, 0) }, uBoxMax: { value: V(0, 0, 0) },
  uSurfY: { value: 0 }, uMpu: { value: 1 }, uDepthOffset: { value: 0 },
  uKdA: { value: new THREE.Vector4() }, uKdB: { value: V(0, 0, 0) },
  uAdapt: { value: 0.6 }, uTime: { value: 0 },
  uSunW: { value: V(0, -1, 0) }, uCosT: { value: 1 },
  uCaust: { value: 0 }, uCausScale: { value: 1 },
  uSigT: { value: V(0, 0, 0) }, uSigS: { value: V(0, 0, 0) },
  uSunCol: { value: V(1, 1, 1) }, uSkyCol: { value: V(0.3, 0.3, 0.3) },
  uShaft: { value: 0 }, uShaftScale: { value: 0.5 }, uShaftFade: { value: 0.05 },
  uExposure: { value: 1 }, uVignette: { value: 0.35 }
};
const UW_GLSL = `
uniform float uOn; uniform vec3 uBoxMin; uniform vec3 uBoxMax;
uniform float uSurfY; uniform float uMpu; uniform float uDepthOffset;
uniform vec4 uKdA; uniform vec3 uKdB; uniform float uAdapt; uniform float uTime;
uniform vec3 uSunW; uniform float uCaust; uniform float uCausScale;
vec3 uwDown(float dm) {
  vec4 a = exp(-uKdA * dm); vec3 b = exp(-uKdB * dm);
  return vec3(${glDot(0)}, ${glDot(1)}, ${glDot(2)});
}
vec3 uwAdapt(vec3 c) { float l = dot(c, vec3(0.2126, 0.7152, 0.0722)); return c * pow(max(l, 0.02), -uAdapt); }
vec2 uwHash(vec2 p) { p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3))); return fract(sin(p) * 43758.5453); }
float uwVoro(vec2 x, float t) {
  vec2 n = floor(x), f = fract(x); float d1 = 8.0, d2 = 8.0;
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 g = vec2(float(i), float(j)); vec2 o = uwHash(n + g);
    o = 0.5 + 0.42 * sin(t * 0.7 + 6.2831 * o);
    float d = length(g + o - f);
    if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) { d2 = d; }
  }
  return d2 - d1;
}
float uwCaustic(vec2 p, float t) {
  float e1 = uwVoro(p, t), e2 = uwVoro(p * 1.63 + 7.3, t * 1.27);
  return pow(1.0 - smoothstep(0.0, 0.2, e1), 3.0) + 0.55 * pow(1.0 - smoothstep(0.0, 0.16, e2), 3.0);
}`;

/* Make a standard material behave as if it sits in the water column:
   its light is filtered by the water above it, plus caustics on up-facing surfaces. */
function uwify(mat, caustics = true) {
  mat.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, UW);
    sh.vertexShader = 'varying vec3 vUwPos;\n' + sh.vertexShader.replace('#include <worldpos_vertex>',
      '#include <worldpos_vertex>\nvUwPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = UW_GLSL + '\nvarying vec3 vUwPos;\n' + sh.fragmentShader.replace('#include <tonemapping_fragment>', `
      if (uOn > 0.5 && vUwPos.y < uSurfY) {
        float du = uSurfY - vUwPos.y;
        vec3 E = uwAdapt(uwDown(uDepthOffset + du * uMpu));
        ${caustics ? `vec3 wN = inverseTransformDirection(normal, viewMatrix);
        float up = clamp(wN.y, 0.0, 1.0);
        vec2 s = vUwPos.xz - uSunW.xz * (du / max(-uSunW.y, 0.25));
        float cs = uwCaustic(s * uCausScale, uTime);
        E *= 1.0 + uCaust * up * exp(-du * uMpu * 0.07) * (cs * 1.7 - 0.35);` : ''}
        gl_FragColor.rgb *= E;
      }
      #include <tonemapping_fragment>`);
  };
  mat.customProgramCacheKey = () => 'uw' + (caustics ? 1 : 0);
  return mat;
}

/* ---------- water pass ---------- */
const post = { scene: new THREE.Scene(), cam: new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1), rt: null };
post.mat = new THREE.ShaderMaterial({
  uniforms: Object.assign({ tColor: { value: null }, tDepth: { value: null }, uInvViewProj: { value: new THREE.Matrix4() }, uCamPos: { value: V(0, 0, 0) } }, UW),
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: UW_GLSL + `
uniform sampler2D tColor; uniform sampler2D tDepth; uniform mat4 uInvViewProj; uniform vec3 uCamPos;
uniform vec3 uSigT; uniform vec3 uSigS; uniform vec3 uSunCol; uniform vec3 uSkyCol; uniform float uCosT;
uniform float uShaft; uniform float uShaftScale; uniform float uShaftFade; uniform float uExposure; uniform float uVignette;
varying vec2 vUv;
vec2 boxHit(vec3 ro, vec3 rd) {
  vec3 inv = 1.0 / rd; vec3 a = (uBoxMin - ro) * inv, b = (uBoxMax - ro) * inv;
  vec3 lo = min(a, b), hi = max(a, b);
  return vec2(max(max(lo.x, lo.y), lo.z), min(min(hi.x, hi.y), hi.z));
}
float shaftPat(vec2 p, float t) {
  float a = sin(p.x * 0.9 + t * 0.33 + sin(p.y * 0.7 + t * 0.21) * 1.5);
  float b = sin(p.y * 1.1 - t * 0.29 + sin(p.x * 0.63 - t * 0.23) * 1.3);
  float c = sin((p.x + p.y) * 0.53 + t * 0.19);
  float v = (a + b + 0.6 * c) / 2.6;
  return 0.3 + 3.6 * pow(0.5 + 0.5 * v, 3.0);
}
vec3 aces(vec3 x) { return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
vec3 toSRGB(vec3 c) { return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c)); }
void main() {
  vec3 col = texture2D(tColor, vUv).rgb;
  float z = texture2D(tDepth, vUv).x;
  vec4 wp = uInvViewProj * vec4(vUv * 2.0 - 1.0, z * 2.0 - 1.0, 1.0);
  wp.xyz /= wp.w;
  float jit = fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))));
  if (uOn > 0.5) {
    vec3 ro = uCamPos, rd = normalize(wp.xyz - ro);
    float tScene = z < 0.99999 ? length(wp.xyz - ro) : 1e5;
    vec2 tb = boxHit(ro, rd);
    float t0 = max(tb.x, 0.0), t1 = min(tb.y, tScene);
    if (t1 > t0) {
      const int N = 40;
      float dt = (t1 - t0) / float(N);
      float ct = -dot(rd, uSunW), g = 0.7;
      float phase = 0.5 + 0.5 * (1.0 - g * g) / pow(1.0 + g * g - 2.0 * g * ct, 1.5);
      vec3 T = vec3(1.0), L = vec3(0.0), stepT = exp(-uSigT * dt);
      for (int i = 0; i < N; i++) {
        vec3 p = ro + rd * (t0 + (float(i) + jit) * dt);
        float du = max(uSurfY - p.y, 0.0), dm = uDepthOffset + du * uMpu;
        vec2 s = p.xz - uSunW.xz * (du / max(-uSunW.y, 0.25));
        float sh = mix(1.0, shaftPat(s * uShaftScale, uTime), uShaft * exp(-dm * uShaftFade));
        vec3 Li = uSkyCol * uwAdapt(uwDown(dm)) + uSunCol * uwAdapt(uwDown(dm / uCosT)) * sh * phase;
        L += T * uSigS * Li * dt;
        T *= stepT;
      }
      col = col * T + L;
    }
  }
  col = aces(col * uExposure);
  vec2 q = vUv - 0.5;
  col *= 1.0 - dot(q, q) * uVignette;
  gl_FragColor = vec4(toSRGB(col) + (jit - 0.5) / 255.0, 1.0);
  gl_FragDepthEXT = z;
}`,
  depthTest: true, depthWrite: true, depthFunc: THREE.AlwaysDepth
});
post.mat.extensions.fragDepth = true;
const postQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post.mat);
postQuad.frustumCulled = false;
post.scene.add(postQuad);
function ensureTargets(w, h) {

const stripTags = h => h.replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ');

      </div>
    </div>
    <p class="ws-note">${ws.note}</p>
    <ol class="ws-list">${ws.items.map(it => `
      <li><span class="set">${it.set}</span><p class="q">${it.q}</p></li>`).join('')}
    </ol>
    <textarea class="ws-copy" id="ws-${modIndex}-text" readonly hidden aria-label="Worksheet questions as text"></textarea>`;
  mod.appendChild(sec);
  const jump = el('button', { type: 'button', class: 'jump', id: `ws-${modIndex}-jump` }, 'Worksheet ↓');
  jump.addEventListener('click', () => sec.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' }));
  mod.firstElementChild.appendChild(jump);
  const text = `${ws.title}\n${ws.note}\n\n` + ws.items.map((it, i) => `${i + 1}. [${stripTags(it.set)}] ${stripTags(it.q)}`).join('\n\n');
  const copyBtn = sec.querySelector(`#ws-${modIndex}-copy`), ta = sec.querySelector('textarea');
  copyBtn.addEventListener('click', () => {

    const fallback = () => { ta.value = text; ta.hidden = false; ta.focus(); ta.select(); copyBtn.textContent = 'Select all and copy'; };

  const w = stage.clientWidth, h = stage.clientHeight;
  if (w !== lastW || h !== lastH) {

}
